name: full-build

# The full 18-month dataset (about 353k orders), built into the persistent
# `kiln` dataset that Metabase reads. Never runs on a PR or on main, so it
# costs Actions minutes only when someone asks for it: click "Run workflow",
# or push to the run-full-build branch (for tools that can push but not
# dispatch workflows).
on:
  workflow_dispatch:
  push:
    branches: [run-full-build]

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform
  GCP_PROJECT_ID: finance-engineer-data-pipeline
  GCP_WIF_PROVIDER: projects/1077021128262/locations/global/workloadIdentityPools/github/providers/github-repo
  GCP_SERVICE_ACCOUNT: kiln-ci@finance-engineer-data-pipeline.iam.gserviceaccount.com
  BQ_LOCATION: US

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shares CI's lock: never two BigQuery builds at once.
    concurrency:
      group: bigquery-ci
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      # dev target: 300 s per-query timeout and the 5 GB per-query billing cap.
      DBT_TARGET: dev
      DBT_DATASET: kiln
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Generate full-scale raw files (seed 7)
        run: uv run python -m generator --scale full --seed 7
      - name: Load raw files into BigQuery (replace-by-file, idempotent)
        run: uv run python -m loader load
      - name: Warehouse counts match the load manifest
        run: uv run python -m loader verify
      - name: dbt build
        run: uv run python -m scripts.run_dbt_ci
      - name: On failure, print orders with negative refund or dispute loss
        if: failure()
        working-directory: transform
        run: |
          uv run dbt show --limit 50 --inline "
            select l.kiln_order_id, l.posting_date, l.source_system, l.source_event_type,
                   l.account_code, l.amount_usd_minor, l.original_currency, l.original_amount_minor
            from {{ ref('fct_ledger_entries') }} as l
            where l.kiln_order_id in (
              select order_id from {{ ref('fct_orders') }}
              where refunded_usd_minor < 0 or dispute_loss_to_seller_usd_minor < 0)
            order by l.kiln_order_id, l.occurred_at, l.account_code" || true
      - name: Every planted data issue is caught (answer key vs warehouse)
        run: uv run python scripts/check_issue_coverage.py
      - name: Preserve dbt results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            transform/target/run_results.json
            transform/target/ci_attempts/
            transform/logs/dbt.log
