name: ci

on:
  pull_request:
  workflow_dispatch:

# One run per PR at a time: a new push cancels the previous run, so two runs
# never write to the same ci_pr_<n> datasets concurrently.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  BQ_LOCATION: ${{ vars.BQ_LOCATION || 'US' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pre-commit (includes sqlfluff)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: dbt parse (no warehouse connection)
        working-directory: transform
        env:
          GCP_PROJECT_ID: parse-only
        run: uv run dbt parse

  build:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: ci
      DBT_DATASET: ci_pr_${{ github.event.pull_request.number || github.run_id }}
    steps:
      - name: Require BigQuery credentials
        env:
          HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::Set the GCP_SA_KEY secret and GCP_PROJECT_ID variable (see README)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: dbt debug
        working-directory: transform
        run: uv run dbt debug
      - name: dbt build
        working-directory: transform
        run: uv run dbt build
      - name: Drop this run's CI datasets
        if: always()
        working-directory: transform
        run: uv run dbt run-operation drop_ci_datasets
