name: ci

on:
  pull_request:
  # Also verify main itself after every merge, not just the PR branches.
  push:
    branches: [main]
  workflow_dispatch:

# One run per PR at a time: a new push cancels the previous run, so two runs
# never write to the same ci_pr_<n> datasets concurrently.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# None of these are secrets: CI authenticates keylessly through Workload
# Identity Federation, and only workflows in this repository can use the
# provider (see scripts/setup_gcp_wif.sh).
env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform
  GCP_PROJECT_ID: finance-engineer-data-pipeline
  GCP_WIF_PROVIDER: projects/1077021128262/locations/global/workloadIdentityPools/github/providers/github-repo
  GCP_SERVICE_ACCOUNT: kiln-ci@finance-engineer-data-pipeline.iam.gserviceaccount.com
  BQ_LOCATION: US

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pre-commit (includes sqlfluff)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Generator tests
        run: uv run pytest -q
      - name: dbt parse (no warehouse connection)
        working-directory: transform
        run: uv run dbt parse

  build:
    needs: lint
    runs-on: ubuntu-latest
    # A hung BigQuery call would otherwise hold the runner for GitHub's 6-hour default.
    timeout-minutes: 15
    # One BigQuery build at a time across the whole repo. Parallel runs from
    # several PRs pushed BigQuery into queueing jobs past our 5-minute limit.
    # A waiting build sits in GitHub's queue, not on a runner.
    concurrency:
      group: bigquery-ci
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # lets the job request a GitHub OIDC token for GCP
    env:
      DBT_TARGET: ci
      # A fresh dataset name every run. Reusing a name dropped seconds earlier
      # correlated with table writes that started but sat idle until timeout.
      DBT_DATASET: ci_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - name: Require GCP identity config
        run: |
          if [[ "$GCP_WIF_PROVIDER" == *REPLACE_WITH* ]]; then
            echo "::error::GCP Workload Identity isn't configured yet. Run scripts/setup_gcp_wif.sh (see README)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: dbt debug
        working-directory: transform
        run: uv run dbt debug
      - name: Generate small-scale raw files
        run: uv run python -m generator --scale small
      - name: Load raw files into BigQuery
        run: uv run python -m loader load
      - name: Re-load must be a no-op (idempotency)
        run: uv run python -m loader load --expect-noop
      - name: Warehouse counts match the load manifest
        run: uv run python -m loader verify
      - name: dbt source freshness
        working-directory: transform
        run: uv run dbt source freshness
      - name: dbt build
        working-directory: transform
        # BigQuery occasionally accepts a table write and never finishes its
        # output stage (DECISIONS 039). Each failure prints the job timeline,
        # then dbt retry re-runs only the failed and skipped nodes (max 2).
        run: |
          uv run dbt build && exit 0
          for attempt in 1 2; do
            uv run python ../scripts/diagnose_bq_jobs.py
            echo "::warning::dbt retry attempt $attempt after a failed BigQuery job"
            uv run dbt retry && exit 0
          done
          exit 1
      - name: Every planted data issue is caught (answer key vs warehouse)
        run: uv run python scripts/check_issue_coverage.py
      - name: dbt docs generate
        working-directory: transform
        run: uv run dbt docs generate
      - name: Every mart model and column is documented
        run: uv run python scripts/check_docs_coverage.py
      - name: Drop this run's CI datasets
        # Only when auth succeeded: before that, nothing can have been created.
        if: always() && steps.auth.outcome == 'success'
        working-directory: transform
        run: uv run dbt run-operation drop_ci_datasets
