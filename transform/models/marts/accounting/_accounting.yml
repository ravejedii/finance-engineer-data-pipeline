version: 2
models:
- name: fct_general_ledger
  description: 'Complete general ledger: transaction postings (fct_ledger_entries) plus month-end close
    entries (FX remeasurement and bad-debt allowance).

    '
  columns:
  - name: ledger_line_id
    data_tests:
    - unique
    - not_null
    description: Stable hash of the journal entry and account. One per journal line.
  - name: journal_entry_id
    description: One source event (or one close entry). Its lines net to zero.
  - name: posting_date
    description: UTC date the line affects the books.
  - name: occurred_at
    description: UTC timestamp of the source event.
  - name: account_code
    data_tests:
    - relationships:
        arguments:
          to: ref('chart_of_accounts')
          field: account_code
    description: Chart of accounts code (seed chart_of_accounts).
  - name: amount_usd_minor
    description: Signed USD cents; positive = debit.
    data_tests:
    - sums_to_zero:
        arguments:
          group_by: journal_entry_id
    - sums_to_zero:
        name: general_ledger_balances_by_month
        arguments:
          group_by: date_trunc(posting_date, month)
  - name: source_system
    description: processor_a, processor_b, bank, app_db, or close (month-end entries).
  - name: source_event_type
    description: 'Kind of source event: charge, refund, dispute, dispute_fee, dispute_reversal, payout,
      payout_reversal, processor_payout_receipt, seller_payout, seller_payout_return, fx_remeasurement,
      bad_debt_allowance.'
  - name: source_reference
    description: ID of the source record (balance transaction, settlement line, bank line, seller payout,
      or month-end date).
  - name: processor_reference
    description: Processor charge/payout reference, or SP-<id> for seller payouts. Joins the ledger to
      bank lines.
  - name: kiln_order_id
    description: Kiln order the line relates to, when there is one.
  - name: seller_id
    description: Seller the line relates to (seller payable lines and seller payouts).
  - name: original_currency
    description: Currency of the source amount before conversion to USD.
  - name: original_amount_minor
    description: Source amount in original_currency minor units.
- name: fct_trial_balance
  description: Monthly trial balance, one row per account per month-end.
  columns:
  - name: month_end
    description: Last day of the month.
  - name: account_code
    description: Chart of accounts code (seed chart_of_accounts).
  - name: account_name
    description: Account name from the chart of accounts.
  - name: account_type
    description: asset, contra_asset, liability, revenue or expense.
  - name: normal_balance
    description: 'debit or credit: the side that increases the account.'
  - name: period_debit_usd_minor
    description: Debits posted in the month, USD cents.
  - name: period_credit_usd_minor
    description: Credits posted in the month, USD cents.
  - name: period_net_usd_minor
    data_tests:
    - sums_to_zero:
        name: trial_balance_period_activity_nets_to_zero
        arguments:
          group_by: month_end
    description: Debits minus credits for the month.
  - name: closing_balance_usd_minor
    description: Cumulative balance at month-end, debit-positive.
    data_tests:
    - sums_to_zero:
        name: trial_balance_nets_to_zero
        arguments:
          group_by: month_end
- name: fct_seller_balance_aging
  description: 'Seller balances at each month-end with days negative. Balances negative for at least var(''bad_debt_aging_days'')
    days are fully reserved.

    '
  data_tests:
  - unique:
      arguments:
        column_name: concat(cast(seller_id as string), '|', cast(month_end as string))
  columns:
  - name: month_end
    description: Month-end the balance is measured at.
  - name: seller_id
    description: Kiln seller ID.
  - name: payable_balance_usd_minor
    description: What Kiln owes the seller, USD cents. Negative = the seller owes Kiln.
  - name: receivable_usd_minor
    description: The negative payable as a positive receivable (0 if Kiln owes the seller).
  - name: negative_since
    description: Date the current negative streak started. Null when not negative.
  - name: days_negative
    description: Days from negative_since to month_end.
  - name: is_reserved
    description: True once days_negative >= var('bad_debt_aging_days').
  - name: allowance_usd_minor
    description: Reserve held against this receivable at month-end.
- name: rpt_close_package
  description: Monthly income statement and balance sheet in presentation form.
  columns:
  - name: month_end
    description: Last day of the month.
  - name: statement
    description: income_statement or balance_sheet.
  - name: section
    description: revenue, expense, total, asset, liability or equity.
  - name: line_item
    description: Account name, or net_income / retained_earnings.
  - name: line_order
    description: Sort order for presentation (account code; totals last).
  - name: amount_usd_minor
    description: Presented amount in USD cents. Revenue, assets, liabilities, equity positive; expenses
      positive as costs.
  - name: amount_usd
    description: amount_usd_minor in dollars (NUMERIC, exact).
unit_tests:
- name: charge_books_realized_fx_as_the_balancing_line
  description: 'EUR 100.00 order, EUR 7.30 platform fee, booked at 0.925 EUR per USD. Processor A settled
    $107.00 gross with a $3.40 fee. Kiln booked the order at $108.11, so the $1.11 it didn''t receive
    is a realized FX loss.

    '
  model: int_journal_lines__settlements
  given:
  - input: ref('int_settlement_events')
    rows:
    - processor: processor_a
      settlement_event_id: txn_1
      event_type: charge
      occurred_at: '2025-07-10 12:00:00'
      event_date: '2025-07-10'
      kiln_order_id: 1
      processor_reference: ch_1
      presentment_currency: EUR
      presentment_amount_minor: 10000
      settlement_currency: USD
      gross_settlement_minor: 10700
      fee_minor: 340
      net_settlement_minor: 10360
  - input: ref('stg_app_db__orders')
    rows:
    - order_id: 1
      seller_id: 7
      currency: EUR
      amount_minor: 10000
      platform_fee_minor: 730
  - input: ref('int_fx_rates_daily')
    rows:
    - currency: EUR
      rate_date: '2025-07-10'
      units_per_usd: 0.925
    - currency: USD
      rate_date: '2025-07-10'
      units_per_usd: 1
  expect:
    rows:
    - account_code: '1000'
      amount_usd_minor: 10360
    - account_code: '5000'
      amount_usd_minor: 340
    - account_code: '2000'
      amount_usd_minor: -10022
    - account_code: '4000'
      amount_usd_minor: -789
    - account_code: '5200'
      amount_usd_minor: 111
- name: charge_with_no_kiln_order_goes_to_suspense
  model: int_journal_lines__settlements
  given:
  - input: ref('int_settlement_events')
    rows:
    - processor: processor_a
      settlement_event_id: txn_2
      event_type: charge
      occurred_at: '2025-07-10 12:00:00'
      event_date: '2025-07-10'
      kiln_order_id: 999
      processor_reference: ch_2
      presentment_currency: EUR
      presentment_amount_minor: 10000
      settlement_currency: USD
      gross_settlement_minor: 10700
      fee_minor: 340
      net_settlement_minor: 10360
  - input: ref('stg_app_db__orders')
    rows:
    - order_id: 1
      seller_id: 7
      currency: EUR
      amount_minor: 10000
      platform_fee_minor: 730
  - input: ref('int_fx_rates_daily')
    rows:
    - currency: EUR
      rate_date: '2025-07-10'
      units_per_usd: 0.925
    - currency: USD
      rate_date: '2025-07-10'
      units_per_usd: 1
  expect:
    rows:
    - account_code: '1000'
      amount_usd_minor: 10360
    - account_code: '5000'
      amount_usd_minor: 340
    - account_code: '2100'
      amount_usd_minor: -10700
- name: negative_balance_is_reserved_after_threshold_and_released_on_recovery
  description: 'Seller paid out, then a $30 dispute lands on Jan 20 (balance -$30). Jan 31: 11 days negative,
    under the 30-day threshold, no reserve. Feb 28: 39 days, fully reserved. Mar 15: a sale brings the
    balance back to zero, so the reserve is released.

    '
  model: fct_seller_balance_aging
  overrides:
    vars:
      bad_debt_aging_days: 30
  given:
  - input: ref('fct_ledger_entries')
    rows:
    - seller_id: 7
      account_code: '2000'
      posting_date: '2025-01-05'
      amount_usd_minor: -5000
    - seller_id: 7
      account_code: '2000'
      posting_date: '2025-01-10'
      amount_usd_minor: 5000
    - seller_id: 7
      account_code: '2000'
      posting_date: '2025-01-20'
      amount_usd_minor: 3000
    - seller_id: 7
      account_code: '4000'
      posting_date: '2025-01-20'
      amount_usd_minor: -999
    - seller_id: 7
      account_code: '2000'
      posting_date: '2025-03-15'
      amount_usd_minor: -3000
  - input: ref('int_month_ends')
    rows:
    - month_end: '2025-01-31'
    - month_end: '2025-02-28'
    - month_end: '2025-03-31'
  expect:
    rows:
    - month_end: '2025-01-31'
      seller_id: 7
      payable_balance_usd_minor: -3000
      days_negative: 11
      is_reserved: false
      allowance_usd_minor: 0
    - month_end: '2025-02-28'
      seller_id: 7
      payable_balance_usd_minor: -3000
      days_negative: 39
      is_reserved: true
      allowance_usd_minor: 3000
    - month_end: '2025-03-31'
      seller_id: 7
      payable_balance_usd_minor: 0
      days_negative: null
      is_reserved: false
      allowance_usd_minor: 0
