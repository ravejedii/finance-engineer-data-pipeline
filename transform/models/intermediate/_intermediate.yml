version: 2

models:
  - name: int_fx_rates_daily
    data_tests:
      - unique:
          arguments:
            column_name: "concat(currency, '|', cast(rate_date as string))"
    columns:
      - name: units_per_usd
        data_tests: [not_null]

  - name: int_settlement_events
    description: >
      One row per money movement at a processor, both processors in one shape.
      Signs are from Kiln's side: money into the processor balance is positive.
    data_tests:
      - unique:
          arguments:
            column_name: "concat(processor, '|', settlement_event_id)"
    columns:
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [charge, refund, dispute, dispute_fee, dispute_reversal, payout,
                         payout_reversal]
      - name: net_settlement_minor
        data_tests: [not_null]

  - name: int_journal_lines__settlements
    columns:
      - name: amount_usd_minor
        data_tests:
          - sums_to_zero:
              arguments:
                group_by: journal_entry_id

  - name: int_journal_lines__cash
    columns:
      - name: amount_usd_minor
        data_tests:
          - sums_to_zero:
              arguments:
                group_by: journal_entry_id
